<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webstore</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">My Webstore</h1>
            <nav class="nav">
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>
    
    <main class="main-content">
        <section class="product-grid">
            <div class="product-card">
                <img src="product1.jpg" alt="Product 1">
                <h2>Product 1</h2>
                <p>$29.99</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product2.jpg" alt="Product 2">
                <h2>Product 2</h2>
                <p>$39.99</p>
                <button>Add to Cart</button>
            </div>
            <!-- Add more product cards as needed -->
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 My Webstore. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
